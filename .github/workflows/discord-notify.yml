name: BLADEX Discord Notify

on:
  push:
    branches: [main]
    paths:
      - '**.lua'

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detectar cambios y notificar
        env:
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1507711633802264718/60BeVZWShEmISQucCHzX4924Ii8B9c6LTJqHC0Wzqy2DAsOXqbCAUuo2EwpKQ9WuFE0j
        run: |
          python3 << 'EOF'
          import subprocess, json, os
          import urllib.request

          # ── Mapeo archivo → nombre del juego ──────────────────────────
          GAMES = {
              "be_a_lucky_block":  "Be A Lucky Block",
              "lucky_block":       "Be A Lucky Block",
              "fly_for_brainrots": "Fly For Brainrots",
              "fly_brainrot":      "Fly For Brainrots",
              "reel_a_brainrot":   "Reel A Brainrot",
              "spear_a_brainrot":  "Spear A Brainrot",
              "jump_tower":        "Jump Tower Simulator",
              "be_a_flash":        "Be A Flash For Brainrot",
              "flash_brainrot":    "Be A Flash For Brainrot",
          }

          CHANGELOG_FILE = "bladex_changelog.json"

          # ── Cargar memoria de cambios ya anunciados ────────────────────
          if os.path.exists(CHANGELOG_FILE):
              with open(CHANGELOG_FILE, "r") as f:
                  announced = json.load(f)
          else:
              announced = {}

          # ── Archivos .lua modificados ──────────────────────────────────
          diff = subprocess.run(
              ["git", "diff", "--name-only", "HEAD~1", "HEAD"],
              capture_output=True, text=True
          ).stdout.strip().split("\n")

          lua_files = [f for f in diff if f.endswith(".lua")]

          # ── Detectar juego ─────────────────────────────────────────────
          game_name = "Script BLADEX"
          for filepath in lua_files:
              base = os.path.splitext(os.path.basename(filepath))[0].lower()
              for key, name in GAMES.items():
                  if key.lower() in base:
                      game_name = name
                      break

          # ── Parsear commit ─────────────────────────────────────────────
          commit = subprocess.run(
              ["git", "log", "-1", "--pretty=%B"],
              capture_output=True, text=True
          ).stdout.strip()

          parts       = [p.strip() for p in commit.split("|")]
          update_type = parts[0] if parts else "ACTUALIZACIÓN"
          all_changes = parts[1:] if len(parts) > 1 else []

          if not all_changes:
              print("Sin cambios en el commit, omitiendo.")
              exit(0)

          # ── Filtrar solo cambios NUEVOS (no anunciados antes) ──────────
          key = f"{game_name}|{update_type}"
          already = set(announced.get(key, []))
          new_changes = [c for c in all_changes if c not in already]

          if not new_changes:
              print("No hay cambios nuevos que anunciar.")
              exit(0)

          # ── Construir mensaje con el formato exacto ────────────────────
          changes_list = "\n".join(new_changes)

          description = (
              f"**{update_type}**\n"
              f"{changes_list}\n\n"
              f"¿Reportar Bug o Sugerencia?\n"
              f"https://discord.com/channels/1469716119588835392/1499164464782643211"
              f" & <#1486060543084069086>"
          )

          payload = {
              "username": "BLADEX HUD",
              "embeds": [{
                  "title": f"**{game_name}**",
                  "description": description,
                  "color": 0xE8000A,
                  "footer": {
                      "text": "BLADEX HUD  •  Sistema de Updates"
                  }
              }]
          }

          # ── Enviar a Discord ───────────────────────────────────────────
          data = json.dumps(payload).encode("utf-8")
          req  = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"], data=data,
              headers={"Content-Type": "application/json"}
          )
          urllib.request.urlopen(req)
          print(f"✅ Enviado: {game_name} — {update_type} — {new_changes}")

          # ── Actualizar memoria ─────────────────────────────────────────
          announced[key] = list(already | set(all_changes))
          with open(CHANGELOG_FILE, "w") as f:
              json.dump(announced, f, indent=2, ensure_ascii=False)

          EOF

      - name: Guardar memoria de cambios
        run: |
          git config user.name  "BLADEX HUD"
          git config user.email "bladex@noreply.github.com"
          git add bladex_changelog.json
          git diff --cached --quiet || git commit -m "chore: update changelog [skip ci]"
          git push
